spring.application.name=backend
cloudflare.r2.access-key-id=your_access_key_id
cloudflare.r2.secret-access-key=your_secret_access_key
cloudflare.r2.account-id=cc180f15d77d692d19cbe06fc2e68634
cloudflare.r2.bucket-name=your_bucket_name

# PostgreSQL Connection Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/myappdb
spring.datasource.username=myappuser
spring.datasource.password=myapppassword

# JPA and Hibernate Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate DDL Auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

# Optional: Show SQL Logging (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration (optional, but recommended)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# Enable Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true